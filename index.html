const TEST_EVOLVE_TIME = 15;
const NORMAL_EVOLVE_TIME = 3600; // 1時間

// =========================================================
//  保存（localStorage）— 通常 / 大人モードで完全分離
// =========================================================
const SLOT_KEYS = { normal: 'mahou_save_normal_v1', adult: 'mahou_save_adult_v1' };

function freshState() {
  return { totalSeconds: 0, characterId: 'egg', discovered: ['egg'], history: [] };
}

function loadSlot(m) {
  try {
    const raw = localStorage.getItem(SLOT_KEYS[m]);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    // 念のため最低限の補正
    if (!CHARACTERS[obj.characterId]) obj.characterId = 'egg';
    if (!Array.isArray(obj.discovered)) obj.discovered = ['egg'];
    if (!Array.isArray(obj.history)) obj.history = [];
    if (typeof obj.totalSeconds !== 'number') obj.totalSeconds = 0;
    return obj;
  } catch (e) {
    return null;
  }
}

function saveSlot() {
  try {
    localStorage.setItem(SLOT_KEYS[mode], JSON.stringify(state));
  } catch (e) {
    console.log('save error', e);
  }
}

function threshold() { return mode === 'adult' ? TEST_EVOLVE_TIME : NORMAL_EVOLVE_TIME; }

// =========================================================
//  音 (Web Audio API)
// =========================================================
function playSound(type) {
  if (isMuted) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtx;
    if (ctx.state === 'suspended') ctx.resume();

    const playTone = (freq, duration, startTime, wave = 'sine', vol = 1) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = wave;
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(vol * volume, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.start(startTime); osc.stop(startTime + duration);
    };
    const now = ctx.currentTime;
    if (type === 'start') { playTone(523.25,0.1,now); playTone(659.25,0.15,now+0.1); }
    else if (type === 'stop') { playTone(587.33,0.1,now); playTone(493.88,0.15,now+0.1); }
    else if (type === 'click') { playTone(880,0.05,now,'triangle',0.5); }
    else if (type === 'levelUp') {
      const b = now;
      playTone(523.25,0.15,b,'triangle');
      playTone(659.25,0.15,b+0.15,'triangle');
      playTone(783.99,0.15,b+0.3,'triangle');
      playTone(1046.50,0.4,b+0.45,'triangle');
      playTone(1174.66,0.08,b+0.5,'sine',0.5);
      playTone(1318.51,0.08,b+0.58,'sine',0.5);
      playTone(1567.98,0.15,b+0.66,'sine',0.5);
    }
  } catch (e) { console.log('Audio Error', e); }
}

// =========================================================
//  時間フォーマット
// =========================================================
function formatTimeText(sec) {
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if (h>0) return `${h}時間 ${m}分 ${s}秒`;
  if (m>0) return `${m}分 ${s}秒`;
  return `${s}秒`;
}
function formatTimerDigits(sec) {
  const h = String(Math.floor(sec/3600)).padStart(2,'0');
  const m = String(Math.floor((sec%3600)/60)).padStart(2,'0');
  const s = String(sec%60).padStart(2,'0');
  return `${h}:${m}:${s}`;
}
function nowStr() {
  const n = new Date();
  return `${n.getMonth()+1}/${n.getDate()} ${n.getHours()}:${String(n.getMinutes()).padStart(2,'0')}`;
}

// =========================================================
//  アイコン描画ヘルパー
// =========================================================
function icon(name, px, cls = '') {
  return `<span class="ic ${cls}" style="width:${px}px;height:${px}px">${svgIcon(name)}</span>`;
}
function charIcon(char, px, studying) {
  const anim = studying ? 'animate-bounce' : 'animate-pulse';
  const dur = studying ? '1s' : '3s';
  let html = `<div class="char-wrap ${char.color} ${anim}" style="animation-duration:${dur}">`;
  html += `<span class="ic" style="width:${px}px;height:${px}px">${svgIcon(char.icon)}</span>`;
  if (studying) {
    html += `<span class="spark"><span class="ic text-yellow-400 animate-spin" style="width:24px;height:24px;animation-duration:2s">${svgIcon('sparkles')}</span></span>`;
  }
  html += `</div>`;
  return html;
}

// =========================================================
//  タイマー処理
// =========================================================
function startTicking() {
  stopTicking();
  timerInterval = setInterval(tick, 1000);
}
function stopTicking() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}
function tick() {
  timerSeconds += 1;
  state.totalSeconds += 1;
  saveSlot();
  updateTimerUI();

  const th = threshold();
  if (state.totalSeconds > 0 && state.totalSeconds % th === 0 && currentChar().next.length > 0) {
    evolve();
  }
}

// タイマータブの数字だけを更新（全体再描画せずアニメ維持）
function updateTimerUI() {
  const td = document.getElementById('timerDigits');
  if (td) td.textContent = formatTimerDigits(timerSeconds);
  const tt = document.getElementById('totalTime');
  if (tt) tt.textContent = formatTimeText(state.totalSeconds);

  const th = threshold();
  const pct = Math.min(100, Math.floor((state.totalSeconds % th) / th * 100));
  const gf = document.getElementById('gaugeFill');
  if (gf) gf.style.width = pct + '%';
  const gp = document.getElementById('gaugePercent');
  if (gp) gp.textContent = '成長ゲージ：' + pct + '%';
  const gr = document.getElementById('gaugeRemain');
  if (gr) {
    const remain = th - (state.totalSeconds % th);
    gr.textContent = (mode === 'adult') ? `あと ${remain}秒` : `あと ${Math.ceil(remain/60)}分`;
  }
}

// 応援メッセージ

    supportMsg = SUPPORT_MESSAGES[Math.floor(Math.random()*SUPPORT_MESSAGES.length)];
    const el = document.getElementById('supportMsg');

function stopMsgRotation() {
  if (msgInterval) { clearInterval(msgInterval); msgInterval = null; }
}

//  操作
// =========================================================
function handleStart() {
  playSound('start');
  isRunning = true;
  startTicking();
  startMsgRotation();
  render();
}
function handleStop() {
  playSound('stop');
  isRunning = false;
  stopTicking();
  stopMsgRotation();
  supportMsg = "お勉強を はじめるときは スタートを おしてね！";

  if (timerSeconds > 0) {
    state.history.unshift({
      date: nowStr(), type: 'study', duration: timerSeconds,
      text: `${Math.floor(timerSeconds/60)}分 ${timerSeconds%60}秒 がんばった！`
    });
    timerSeconds = 0;
    saveSlot();
  }
  render();
}

function evolve() {
  const cur = currentChar();
  if (cur.next.length === 0) return;
  isRunning = false;
  stopTicking();
  stopMsgRotation();
  playSound('levelUp');

  let nextId = cur.next[Math.floor(Math.random()*cur.next.length)];
  if (!CHARACTERS[nextId]) {
    const finals = Object.values(CHARACTERS).filter(c => c.level === 5);
    nextId = finals[Math.floor(Math.random()*finals.length)].id;
  }
  prevCharacterId = state.characterId;
  state.characterId = nextId;
  if (!state.discovered.includes(nextId)) state.discovered.push(nextId);

  state.history.unshift({
    date: nowStr(), type: 'evolution', duration: timerSeconds,
    text: `${CHARACTERS[nextId].name} に 成長したよ！🌟`
  });
  saveSlot();

  showEvolutionModal = true;
  render();
}

function closeModal() { playSound('click'); showEvolutionModal = false; render(); }

function setTab(t) { playSound('click'); activeTab = t; render(); }

function toggleMute() { isMuted = !isMuted; playSound('click'); render(); }

// モード切替（要件：通常データは絶対に壊さない）
function toggleAdult() {
  if (mode === 'normal') {
    askConfirm(
      "「おとなモード（15秒で成長）」に切り替えます。<br>動作確認用のモードです。<br><br>通常モードのデータは別に保存され、<br>消えませんのでご安心ください。<br><br>切り替えますか？",
      () => switchMode('adult')
    );
  } else {
    switchMode('normal');
  }
}

function switchMode(target) {
  if (target === mode) return;
  saveSlot();                 // いまのモードのデータを確定保存
  isRunning = false; stopTicking(); stopMsgRotation();
  mode = target;
  state = loadSlot(target) || freshState();
  timerSeconds = 0;
  supportMsg = "お勉強を はじめるときは スタートを おしてね！";
  saveSlot();                 // 切替先スロットを生成
  playSound('click');
  render();
}

// 記録の時間修正
function clampInt(v, min, max) { v = parseInt(v, 10); if (isNaN(v)) v = 0; return Math.max(min, Math.min(max, v)); }
function openEditLog(idx) {
  const log = state.history[idx];
  if (!log || log.type !== 'study') return;
  playSound('click');
  editingLog = { idx, minutes: Math.floor(log.duration / 60), seconds: log.duration % 60 };
  render();
}
function setEditMin(v) { if (editingLog) editingLog.minutes = clampInt(v, 0, 599); }
function setEditSec(v) { if (editingLog) editingLog.seconds = clampInt(v, 0, 59); }
function stepEditMin(d) { if (editingLog) { editingLog.minutes = clampInt(editingLog.minutes + d, 0, 599); render(); } }
function stepEditSec(d) { if (editingLog) { editingLog.seconds = clampInt(editingLog.seconds + d, 0, 59); render(); } }
function cancelEditLog() { editingLog = null; playSound('click'); render(); }
function saveEditLog() {
  if (!editingLog) return;
  const log = state.history[editingLog.idx];
  if (!log || log.type !== 'study') { editingLog = null; render(); return; }
  const newDur = editingLog.minutes * 60 + editingLog.seconds;
  const delta = newDur - log.duration;
  log.duration = newDur;
  log.text = `${editingLog.minutes}分 ${editingLog.seconds}秒 がんばった！`;
  state.totalSeconds = Math.max(0, state.totalSeconds + delta); // 累積とゲージにも反映
  editingLog = null;
  playSound('start');
  saveSlot();
  render();
}

// アプリ内 確認ダイアログ（ネイティブconfirmはサンドボックスで無効化されるため自前実装）
let confirmDialog = null; // { message, onYes }
function askConfirm(message, onYes) { confirmDialog = { message, onYes }; render(); }
function confirmYes() {
  const cb = confirmDialog ? confirmDialog.onYes : null;
  confirmDialog = null;
  playSound('click');
  render();
  if (cb) cb();
}
function confirmNo() { confirmDialog = null; playSound('click'); render(); }

// =========================================================
//  画面描画
// =========================================================
function render() {
  const char = currentChar();
  const th = threshold();
  const pct = Math.min(100, Math.floor((state.totalSeconds % th) / th * 100));
  const remain = th - (state.totalSeconds % th);
  const remainText = (mode === 'adult') ? `あと ${remain}秒` : `あと ${Math.ceil(remain/60)}分`;
  const totalChars = Object.keys(CHARACTERS).length;

  let html = '';

  // ===== ヘッダー =====
  html += `
  <div class="min-h-screen bg-gradient-to-b from-pink-50 via-purple-50 to-blue-50 text-gray-800 font-sans pb-12 flex flex-col items-center">
    <header class="w-full max-w-md bg-white/80 backdrop-blur shadow-md rounded-b-3xl py-4 px-6 flex justify-between items-center border-b border-pink-100">
      <div class="flex items-center space-x-2">
        <div class="bg-pink-400 p-1.5 rounded-full text-white animate-pulse">${icon('sparkles',20)}</div>
        <span class="font-bold text-lg text-pink-600 tracking-wider">まほうのたまご</span>
      </div>
      <div class="flex items-center space-x-3">
        ${mode === 'adult' ? `<span class="text-[10px] px-2 py-1 rounded-full bg-purple-500 text-white font-bold">⚡おとなモード</span>` : ``}
        <button onclick="toggleMute()" class="p-1.5 text-pink-500 hover:bg-pink-50 rounded-full transition-colors">
          ${icon(isMuted ? 'volume-x' : 'volume-2', 20)}
        </button>
      </div>
    </header>

    <main class="w-full max-w-md px-4 mt-6 flex-grow">
      <div class="grid grid-cols-3 gap-2 mb-4">
        <button onclick="setTab('timer')" class="py-3 rounded-2xl flex flex-col items-center justify-center space-y-1 transition-all ${activeTab==='timer' ? 'bg-gradient-to-r from-pink-400 to-pink-500 text-white shadow-md shadow-pink-200 font-bold scale-105' : 'bg-white text-gray-500'}">
          ${icon('clock',20)}<span class="text-xs">タイマー</span>
        </button>
        <button onclick="setTab('zukan')" class="py-3 rounded-2xl flex flex-col items-center justify-center space-y-1 transition-all ${activeTab==='zukan' ? 'bg-gradient-to-r from-purple-400 to-purple-500 text-white shadow-md shadow-purple-200 font-bold scale-105' : 'bg-white text-gray-500'}">
          ${icon('book-open',20)}<span class="text-xs">ずかん (${state.discovered.length})</span>
        </button>
        <button onclick="setTab('history')" class="py-3 rounded-2xl flex flex-col items-center justify-center space-y-1 transition-all ${activeTab==='history' ? 'bg-gradient-to-r from-cyan-400 to-cyan-500 text-white shadow-md shadow-cyan-200 font-bold scale-105' : 'bg-white text-gray-500'}">
          ${icon('award',20)}<span class="text-xs">きろく</span>
        </button>
      </div>
  `;

  // ===== A. タイマー =====
  if (activeTab === 'timer') {
    html += `
      <div class="space-y-4">
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-pink-100 relative overflow-hidden flex flex-col items-center">
          <div class="absolute top-2 right-3 flex items-center space-x-1 bg-pink-50 text-pink-600 px-2.5 py-0.5 rounded-full text-xs font-semibold">
            <span>Lv.${char.level}</span><span>${char.name}</span>
          </div>
          <div class="relative mb-4 mt-2 max-w-[85%]">
            <div id="supportMsg" class="bg-pink-50 text-pink-700 text-sm py-2 px-4 rounded-2xl border border-pink-200 text-center font-bold shadow-sm">${supportMsg}</div>
            <div class="w-3 h-3 bg-pink-50 border-r border-b border-pink-200 absolute left-1/2 -bottom-1.5 -translate-x-1/2 rotate-45"></div>
          </div>
          <div class="relative my-8">${charIcon(char, 120, isRunning)}</div>
          <div class="w-full mt-2">
            <div class="flex justify-between items-center text-xs text-purple-600 font-bold mb-1">
              <span id="gaugePercent" class="flex items-center">${icon('flame',16,'text-orange-500 mr-1')}成長ゲージ：${pct}%</span>
              <span id="gaugeRemain">${remainText}</span>
            </div>
            <div class="w-full h-4 bg-purple-100 rounded-full overflow-hidden border border-purple-200 p-0.5">
              <div id="gaugeFill" class="h-full bg-gradient-to-r from-pink-400 via-purple-400 to-pink-500 rounded-full transition-all duration-300" style="width:${pct}%"></div>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-3xl p-6 shadow-sm border border-pink-100 flex flex-col items-center">
          <div class="text-center my-2">
            <p class="text-xs font-bold text-gray-400 tracking-wider">⏱ 今回のがんばり時間</p>
            <h2 id="timerDigits" class="text-5xl font-mono font-bold text-gray-700 tracking-widest mt-1">${formatTimerDigits(timerSeconds)}</h2>
          </div>
          <div class="flex space-x-4 w-full mt-4">
            ${isRunning
              ? `<button onclick="handleStop()" class="flex-1 py-4 bg-gradient-to-r from-yellow-400 to-amber-500 text-white rounded-2xl font-bold text-lg shadow-md active:scale-95 transition-all flex items-center justify-center space-x-2 animate-pulse">${icon('square',20)}<span>おわる（保存）</span></button>`
              : `<button onclick="handleStart()" class="flex-1 py-4 bg-gradient-to-r from-pink-400 to-pink-500 text-white rounded-2xl font-bold text-lg shadow-md active:scale-95 transition-all flex items-center justify-center space-x-2">${icon('play',24)}<span>お勉強スタート！</span></button>`
            }
          </div>
          <div class="mt-4 pt-4 border-t border-gray-100 w-full flex justify-between text-xs text-gray-500">
            <span>ぜんぶのがんばり時間：</span>
            <span id="totalTime" class="font-bold text-pink-600 text-sm">${formatTimeText(state.totalSeconds)}</span>
          </div>
        </div>

        ${char.level === 5 ? `
        <div class="bg-purple-100 rounded-3xl p-4 text-center border border-purple-200">
          <p class="text-xs text-purple-700 font-bold mb-2">🎉 おめでとう！最高レベル（Lv.5）まで 育ったよ！</p>
          <button onclick="resetToEgg()" class="py-2 px-4 bg-purple-500 text-white text-xs font-bold rounded-xl transition-colors shadow">新しい たまご をもらう 🥚</button>
        </div>` : ``}
      </div>
    `;
  }

  // ===== B. ずかん =====
  if (activeTab === 'zukan') {
    let grid = '';
    Object.values(CHARACTERS).forEach(c => {
      const found = state.discovered.includes(c.id);
      grid += `
        <div class="border rounded-xl p-2 flex flex-col items-center justify-center relative aspect-square ${found ? 'bg-gradient-to-b from-purple-50 to-white border-purple-200 shadow-sm' : 'bg-gray-50 border-gray-100 text-gray-300'}">
          <span class="absolute top-1 left-1.5 text-[8px] font-bold text-gray-400">Lv.${c.level}</span>
          ${found
            ? `${charIcon(c, 24, false)}<span class="text-[8px] font-bold text-purple-600 text-center mt-1 leading-tight break-words w-full">${c.name}</span>`
            : `${icon('help-circle',20,'text-gray-300')}<span class="text-[8px] font-bold text-gray-400 text-center mt-1">？？？</span>`
          }
        </div>`;
    });
    html += `
      <div class="bg-white rounded-3xl p-4 shadow-sm border border-purple-100 space-y-4">
        <div class="text-center">
          <h2 class="text-lg font-bold text-purple-600 flex items-center justify-center space-x-1">${icon('book-open',20)}<span>ペットずかん</span></h2>
          <p class="text-xs text-gray-400 mt-1">見つけたペット： ${state.discovered.length} / ${totalChars} 匹</p>
          <div class="w-full bg-gray-200 rounded-full h-2 mt-2"><div class="bg-purple-500 h-2 rounded-full" style="width:${(state.discovered.length/totalChars)*100}%"></div></div>
        </div>
        <div class="grid grid-cols-4 gap-2 max-h-[60vh] overflow-y-auto pr-1 pb-4 scroll-area">${grid}</div>
      </div>`;
  }

  // ===== C. きろく =====
  if (activeTab === 'history') {
    let logs = '';
    if (state.history.length === 0) {
      logs = `<div class="text-center py-8 text-gray-400 text-xs">まだ お勉強のきろくが ありません。<br />タイマーをスタートして、がんばりをためよう！</div>`;
    } else {
      state.history.forEach((log, idx) => {
        logs += `
          <div class="p-3 rounded-xl border flex justify-between items-center ${log.type==='evolution' ? 'bg-gradient-to-r from-purple-50 to-pink-50 border-purple-200' : 'bg-gray-50 border-gray-100'}">
            <div>
              <div class="flex items-center space-x-1.5">
                <span class="text-[10px] text-gray-400">${log.date}</span>
                ${log.type==='evolution' ? `<span class="text-[10px] bg-purple-100 text-purple-700 px-1.5 rounded font-bold">成長</span>` : ``}
              </div>
              <p class="text-xs font-bold text-gray-700 mt-1">${log.text}</p>
            </div>
            ${log.type==='study' ? `<div class="flex items-center gap-1.5 shrink-0"><span class="text-xs text-gray-500 font-mono">+${formatTimerDigits(log.duration)}</span><button onclick="openEditLog(${idx})" class="p-1.5 text-cyan-500 hover:bg-cyan-50 rounded-full active:scale-90 transition-all">${icon('pencil',16)}</button></div>` : ``}
          </div>`;
      });
    }
    html += `
      <div class="bg-white rounded-3xl p-6 shadow-sm border border-cyan-100 space-y-4">
        <div class="text-center"><h2 class="text-lg font-bold text-cyan-600 flex items-center justify-center space-x-1">${icon('award',20)}<span>がんばりログ</span></h2></div>
        <div class="space-y-2 max-h-[50vh] overflow-y-auto pr-1 scroll-area">${logs}</div>
        <div class="pt-4 border-t border-gray-100 text-center">
          <button onclick="fullReset()" class="text-[10px] text-red-400 hover:text-red-500 underline flex items-center justify-center mx-auto space-x-1">${icon('rotate-ccw',12)}<span>ぜんぶ はじめから やり直す</span></button>
        </div>
      </div>`;
  }

  // ===== main 閉じ + フッター（大人モードボタンを最下部に配置） =====
  html += `
    </main>

    <footer class="w-full max-w-md text-center mt-6 px-6 space-y-3">
      <div class="flex items-center justify-center space-x-1.5 text-[10px] text-gray-400 bg-white/40 py-2 rounded-xl backdrop-blur">
        ${icon('info',14,'text-pink-400')}<span>毎日の記録は自動で保存されます（この端末のブラウザ内）</span>
      </div>
      <div class="pt-2">
        <button onclick="toggleAdult()" class="text-[10px] ${mode==='adult' ? 'text-purple-500 underline' : 'text-gray-300 hover:text-gray-400'} transition-colors">
          ${mode==='adult' ? '⚡ おとなモード解除（通常モードに戻す）' : 'おとなモードに切り替える（動作確認用）'}
        </button>
      </div>
    </footer>
  </div>
  `;

  // ===== 進化モーダル =====
  if (showEvolutionModal) {
    const prev = prevCharacterId ? CHARACTERS[prevCharacterId] : null;
    html += `
      <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full border-4 border-pink-300 text-center shadow-2xl relative overflow-hidden pop">
          <div class="absolute inset-0 bg-gradient-to-b from-pink-50/50 via-purple-50/50 to-white pointer-events-none -z-10"></div>
          <div class="absolute top-2 left-1/2 -translate-x-1/2">${icon('sparkles',40,'text-yellow-400 animate-spin')}</div>
          <h3 class="text-xl font-black text-pink-600 mt-4 tracking-wider animate-bounce">🌟 おおきくなったよ！ 🌟</h3>
          <div class="flex items-center justify-center my-6 space-x-3">
            ${prev ? `<div class="opacity-50 scale-75 border-2 border-dashed border-pink-200 p-2 rounded-2xl bg-white">${charIcon(prev,48,false)}<p class="text-[10px] font-bold text-gray-400 mt-1">${prev.name}</p></div>` : ``}
            ${icon('chevron-right',24,'text-pink-400')}
            <div class="p-4 bg-gradient-to-b from-yellow-50 to-white border-2 border-yellow-300 rounded-3xl shadow-md scale-110">${charIcon(char,64,false)}<p class="text-sm font-bold text-pink-600 mt-2">${char.name}</p></div>
          </div>
          <p class="text-sm font-bold text-purple-700 px-2 leading-relaxed">キミが がんばってお勉強したから、<br /><span class="text-lg text-pink-600 underline decoration-pink-300 decoration-wavy">${char.name}</span>にしんかしたよ！</p>
          <p class="text-xs text-gray-500 mt-3 px-4 leading-relaxed bg-gray-50 py-2.5 rounded-2xl">${char.desc}</p>
          <button onclick="closeModal()" class="mt-6 w-full py-3 bg-gradient-to-r from-pink-400 to-pink-500 text-white font-bold rounded-2xl shadow-md transition-all text-sm">いっしょに お勉強を つづける！💖</button>
        </div>
      </div>`;
  }


  // 記録の時間修正モーダル
  if (editingLog) {
    const em = editingLog.minutes, es = editingLog.seconds;
    html += `
      <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-xs w-full border-4 border-cyan-200 text-center shadow-2xl pop">
          <h3 class="text-base font-bold text-cyan-600 mb-1">じかんを なおす</h3>
          <p class="text-[11px] text-gray-400 mb-4">計測した がんばり時間を しゅうせいできます</p>
          <div class="flex items-end justify-center gap-2 mb-3">
            <div>
              <div class="flex items-center gap-1">
                <button onclick="stepEditMin(-1)" class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 font-bold text-lg active:scale-90">−</button>
                <input id="editMin" inputmode="numeric" value="${em}" oninput="setEditMin(this.value)" class="w-14 text-center text-2xl font-mono font-bold text-gray-700 border-b-2 border-cyan-200 focus:outline-none focus:border-cyan-400 py-1" />
                <button onclick="stepEditMin(1)" class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 font-bold text-lg active:scale-90">＋</button>
              </div>
              <p class="text-[11px] text-gray-400 mt-1">分</p>
            </div>
            <span class="text-2xl font-bold text-gray-300 pb-7">:</span>
            <div>
              <div class="flex items-center gap-1">
                <button onclick="stepEditSec(-1)" class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 font-bold text-lg active:scale-90">−</button>
                <input id="editSec" inputmode="numeric" value="${es}" oninput="setEditSec(this.value)" class="w-14 text-center text-2xl font-mono font-bold text-gray-700 border-b-2 border-cyan-200 focus:outline-none focus:border-cyan-400 py-1" />
                <button onclick="stepEditSec(1)" class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 font-bold text-lg active:scale-90">＋</button>
              </div>
              <p class="text-[11px] text-gray-400 mt-1">秒</p>
            </div>
          </div>
          <p class="text-[10px] text-gray-400 mb-4 leading-relaxed">※「ぜんぶのがんばり時間」と<br>せいちょうゲージにも はんえいされます</p>
          <div class="flex gap-3">
            <button onclick="cancelEditLog()" class="flex-1 py-3 bg-gray-100 text-gray-500 font-bold rounded-2xl text-sm active:scale-95">やめる</button>
            <button onclick="saveEditLog()" class="flex-1 py-3 bg-gradient-to-r from-cyan-400 to-cyan-500 text-white font-bold rounded-2xl text-sm shadow active:scale-95">なおす</button>
          </div>
        </div>
      </div>`;
  }

  // 確認ダイアログ
  if (confirmDialog) {
    html += `
      <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-xs w-full border-4 border-purple-200 text-center shadow-2xl pop">
          <p class="text-sm font-bold text-gray-700 leading-relaxed">${confirmDialog.message}</p>
          <div class="flex gap-3 mt-6">
            <button onclick="confirmNo()" class="flex-1 py-3 bg-gray-100 text-gray-500 font-bold rounded-2xl text-sm active:scale-95 transition-all">やめる</button>
            <button onclick="confirmYes()" class="flex-1 py-3 bg-gradient-to-r from-purple-400 to-purple-500 text-white font-bold rounded-2xl text-sm shadow active:scale-95 transition-all">はい</button>
          </div>
        </div>
      </div>`;
  }

  document.getElementById('app').innerHTML = html;
}

// =========================================================
//  起動
// =========================================================
window.addEventListener('DOMContentLoaded', () => {
  saveSlot();   // 初回起動でも通常スロットを作成
  render();
});

//APP_END
</script>
</body>
</html>
